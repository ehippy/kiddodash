name: kiddodash

services:
  app:
    build: .
    container_name: kiddodash
    ports:
      - "8321:3000"
    volumes:
      - kiddodash_data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      # One-time PIN bootstrap: `ADMIN_PIN=... KID_PIN_1=... docker compose up -d`
      # seeds the PINs into the DB/settings on first boot; afterwards these can
      # stay empty (existing PINs are never overwritten from env). PIN changes
      # happen in the app's Access tab.
      - ADMIN_PIN=${ADMIN_PIN:-}
      - KID_PIN_1=${KID_PIN_1:-}
      - KID_PIN_2=${KID_PIN_2:-}
    restart: unless-stopped

  # Development: hot reload for code changes.
  # Usage:   docker compose --profile dev up -d
  # Teardown: docker compose --profile dev down && docker compose up -d
  #
  # NOTE: server.js is a DIRECTORY bind mount (not a single-file mount):
  # Docker Desktop's file sharing loses single-file binds when the host file
  # is atomically replaced, which breaks hot reload.
  app-dev:
    image: kiddodash-app:latest
    container_name: kiddodash-dev
    profiles: ["dev"]
    ports:
      - "8322:3000"
    volumes:
      - .:/src:ro
      - kiddodash_data:/data
    environment:
      - NODE_ENV=development
      - DATA_DIR=/data
    working_dir: /src
    command: ["node", "--watch", "server.js"]
    restart: "no"

volumes:
  kiddodash_data:
